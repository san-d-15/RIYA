<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Rounded Square Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#favShadow)"/>

  <!-- Medical Cross Base in Medical Blue -->
  <g id="fav-cross">
    <rect x="27" y="14" width="10" height="36" rx="5" fill="url(#favBlue)"/>
    <rect x="14" y="27" width="36" height="10" rx="5" fill="url(#favBlue)"/>
  </g>

  <!-- Slanted Pill Overlay in Vibrant Teal & White -->
  <g transform="rotate(-30 32 32)">
    <rect x="18" y="25" width="28" height="14" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
    <path d="M 26,25 L 39,25 C 42.8,25 46,28.1 46,32 C 46,35.9 42.8,39 39,39 L 26,39 Z" fill="url(#favTeal)"/>
    <path d="M 26,25 L 26,39 C 22.1,39 19,35.9 19,32 C 19,28.1 22.1,25 26,25 Z" fill="#F8FAFC"/>
    <line x1="26" y1="25" x2="26" y2="39" stroke="#CBD5E1" stroke-width="0.75"/>
  </g>

  <!-- Vitality Heartline Pulse -->
  <path d="M 22 32 L 27 32 L 30 26 L 34 38 L 37 30 L 40 32 L 43 32" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
