<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="100%" height="100%" class="medcare-logo-svg" role="img" aria-label="MedCare Pharmacy Logo">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="medBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    
    <linearGradient id="medTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>

    <linearGradient id="capsuleWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Subtle Aura Glow Filter -->
    <filter id="medGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM GROUP -->
  <g id="logo-icon-emblem" class="logo-symbol-group" transform="translate(4, 4)" filter="url(#softShadow)">
    
    <!-- Outer Gentle Glow Ring -->
    <circle class="logo-glow-aura" cx="32" cy="32" r="30" fill="none" stroke="url(#medTealGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.35"/>

    <!-- Subtle Halo Backdrop -->
    <circle class="logo-halo-bg" cx="32" cy="32" r="28" fill="#F0FDF4" opacity="0.8"/>

    <!-- 1. The Medical Cross (Primary Anchor) -->
    <g class="logo-cross" id="medical-cross-shape">
      <!-- Vertical Bar with rounded ends -->
      <rect x="26" y="12" width="12" height="40" rx="6" fill="url(#medBlueGrad)" filter="url(#medGlowFilter)"/>
      <!-- Horizontal Bar with rounded ends -->
      <rect x="12" y="26" width="40" height="12" rx="6" fill="url(#medBlueGrad)"/>
    </g>

    <!-- 2. Integrated Capsule/Pill (Slanted Dynamic Overlay) -->
    <g class="logo-capsule" id="capsule-shape" transform="rotate(-32 32 32)">
      <!-- Pill Container Base Shadow -->
      <rect x="18" y="24" width="28" height="16" rx="8" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" stroke-width="0.5"/>
      <!-- Teal Active Half of Capsule -->
      <path d="M 26,24 L 38,24 C 42.4,24 46,27.6 46,32 C 46,36.4 42.4,40 38,40 L 26,40 Z" fill="url(#medTealGrad)"/>
      <!-- White Medicine Half with Specular Highlight -->
      <path d="M 26,24 L 26,40 L 26,40 C 21.6,40 18,36.4 18,32 C 18,27.6 21.6,24 26,24 Z" fill="url(#capsuleWhiteGrad)"/>
      <!-- Capsule Center Seam Line -->
      <line x1="26" y1="24" x2="26" y2="40" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Capsule Reflection Pill Sheen -->
      <rect x="21" y="26" width="22" height="2" rx="1" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- 3. Subtle Health Heartbeat / Vitality Pulse Accent -->
    <path class="logo-heartline" d="M 20 32 L 27 32 L 30 25 L 34 39 L 37 30 L 40 32 L 44 32" 
          fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Core Vitality Light Node -->
    <circle class="logo-core-dot" cx="32" cy="32" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g id="logo-text-group" class="logo-typography-group" transform="translate(76, 0)">
    <!-- Primary Brand Wordmark "MedCare" -->
    <text x="0" y="42" class="logo-brand-name" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="30" 
          font-weight="800" 
          letter-spacing="-0.5">
      <tspan fill="#1976D2" class="text-med">Med</tspan><tspan fill="#00A896" class="text-care">Care</tspan>
    </text>

    <!-- Subtitle "PHARMACY" with Trust Shield Icon Motif -->
    <g transform="translate(1, 58)" class="logo-subtitle-group">
      <circle cx="3" cy="-3.5" r="2" fill="#00A896"/>
      <text x="10" y="0" class="logo-brand-sub" 
            font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
            font-size="10" 
            font-weight="700" 
            letter-spacing="4.5" 
            fill="#64748B">PHARMACY</text>
    </g>
  </g>
</svg>
