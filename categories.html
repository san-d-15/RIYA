<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management - MedCare Pharmacy</title>
  <meta name="description" content="Organize pharmaceutical classifications, therapeutic categories, and drug inventory groups.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="top-header" id="app-header"></header>

      <main class="content-body">
        
        <div class="page-header">
          <div class="page-title-block">
            <h1>Medicine Categories</h1>
            <p id="category-count-display">Therapeutic groups and classifications for cataloging medicines.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openAddCategoryModal()">
              <i class="fa-solid fa-plus"></i> Add Category
            </button>
          </div>
        </div>

        <div class="card">
          <div class="p-4 border-b border-slate-200">
            <div class="search-input-group max-w-sm">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="category-search-input" placeholder="Search category name or description...">
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Category Name</th>
                  <th>Description</th>
                  <th class="text-center">Medicines In Category</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-tbody">
                <!-- Dynamically populated by js/categories.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Category Modal -->
  <div class="modal-backdrop" id="category-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-cat-title">Add Category</h3>
        <button class="modal-close-btn" onclick="MedCareUI.closeModal('category-modal')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="category-form">
        <div class="modal-body space-y-4">
          <div class="form-group">
            <label class="form-label" for="cat-name">Category Name <span class="required">*</span></label>
            <input type="text" id="cat-name" class="form-control" placeholder="e.g. Antihypertensives" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="cat-description">Description</label>
            <textarea id="cat-description" rows="3" class="form-control" placeholder="Clinical notes, therapeutic uses, indications..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="MedCareUI.closeModal('category-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-check"></i> Save Category
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
